services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://newspaper:newspaper_dev@db:5432/newspaper
    depends_on:
      - db

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: newspaper
      POSTGRES_USER: newspaper
      POSTGRES_PASSWORD: newspaper_dev

volumes:
  postgres_data: